            </div>

                <div class="bank" style="width: 120px; ">
                    <select class="form-select form-select-sm mb-2" name="institutionID" id="sellerName"
                        (change)="onBankChange($event)">
                        <option value="" selected>All</option>
                        <option *ngFor="let seller of sellerData" [value]="seller.id">{{ seller.name }}</option>
                    </select>
                </div>

            </div>
        </div>

    </div>

        <div class="table-row">
            <table class="table">
                <thead class="table-head-hover">
                    <tr>

                        <th scope="col">Ticket ID</th>
                        <th scope="col-2">Subject</th>
                        <th scope="col">Institution</th>
                        <th scope="col">Priority</th>
                        <th scope="col">Creation Date</th>
                        <th scope="col">Action</th>
                        <th scope="col">Change Status</th>
                    </tr>

                </thead>
                <tbody>
                    <tr *ngFor="let issue of issuesList">
                        <td scope="col">{{issue.ticketId}}</td>
                        <td scope="col-2">{{issue.subject}}</td>
                        <td scope="col">{{issue.institution}}</td>
                        <td scope="col">{{issue.priority}}</td>
                        <td scope="col">{{issue.createdAt}}</td>
                        <td scope="col">
                            <button class="btn btn-sm btn-primary" (click)="viewDetails(issue)"><i
                                    class="ri-eye-line"></i> View </button>
                        </td>
                        <td scope="col"> 
                            <ng-container *ngIf="issue.status === 'Closed'; else showSelect">
                                <select [(ngModel)]="issue.status" disabled (change)="onStatusChange(issue)"
                                class="form-select" style="padding: 2px 10px; width: 70%;">
                                <option value="Open">Open</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Resolved">Resolved</option>
                                <option value="Closed">Closed</option>
                            </select>
                            </ng-container>
                            <ng-template #showSelect>
                                <select [(ngModel)]="issue.status" (change)="onStatusChange(issue)"
                                    class="form-select" style="padding: 2px 10px;  width: 70%;">
                                    <option value="Open">Open</option>
                                    <option value="In Progress">In Progress</option>
                                    <option value="Resolved">Resolved</option>
                                    <option value="Closed">Closed</option>
                                </select>
                            </ng-template>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <app-paginator [length]="totalCount" [pageSize]="10" [pageSizeOptions]="[10, 20, 50]"
            (page)="handlePageEvent($event)"></app-paginator>
    </div>

</div>
