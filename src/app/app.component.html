<ng-container *ngIf="shouldShowSideNav()">
  <app-sidenav (onToggleSideNav)="onToggleSideNav($event)"></app-sidenav>

  <app-header
    *ngIf="!isLoginPage() && !isForgotPage() && !isOtpPage() && !isResetPage()"
    [collapsed]="isSideNavCollapsed"
    [screenWidth]="screenWidth"
  ></app-header>
</ng-container>
<app-body [collapsed]="isSideNavCollapsed" [screenWidth]="screenWidth"></app-body>
