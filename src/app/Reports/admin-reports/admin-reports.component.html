<div class="reports-container">
  <div class="create-report">
    <header class="rp-header">
      <h1>Reports</h1>
      <p>
        Build an {{ activeReport === 'order' ? 'order' : 'shipment' }} extract
        once, then run it whenever you need it.
      </p>
    </header>

    <div class="report-options">
      <div class="rp-segment" role="tablist" aria-label="Report type">
        <button
          type="button"
          role="tab"
          [attr.aria-selected]="activeReport === 'order'"
          [class.active]="activeReport === 'order'"
          (click)="navigateToOrderReport()"
        >
          Order Reports
        </button>
        <button
          type="button"
          role="tab"
          [attr.aria-selected]="activeReport === 'shipment'"
          [class.active]="activeReport === 'shipment'"
          (click)="navigateToShipmentReport()"
        >
          Shipment Reports
        </button>
      </div>
    </div>

    <app-order-report *ngIf="activeReport === 'order'"></app-order-report>
    <app-shipment-report
      *ngIf="activeReport === 'shipment'"
    ></app-shipment-report>
  </div>
</div>
