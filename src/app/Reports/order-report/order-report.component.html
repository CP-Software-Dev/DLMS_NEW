<div class="rp-page">
  <div class="rp-grid">
    <!-- ============ NEW REPORT ============ -->
    <section class="rp-card">
      <div class="rp-card-head">New Order report</div>

      <div class="rp-card-body">
        <div class="rp-row-2" [class.rp-single]="!isAdmin">
          <div class="rp-field">
            <label for="reportName">Report name</label>
            <input
              id="reportName"
              type="text"
              name="reportName"
              [(ngModel)]="reportName"
              placeholder="Enter report name"
              required
            />
          </div>

          <div class="rp-field" *ngIf="isAdmin">
            <label for="sellerName">Bank</label>
            <select id="sellerName" name="sellerName" [(ngModel)]="sellerId">
              <option value="" disabled>Select bank</option>
              <option *ngFor="let seller of sellerData" [value]="seller.id">
                {{ seller.name }}
              </option>
            </select>
          </div>
        </div>

        <div class="rp-row-2">
          <div class="rp-field">
            <label for="fromDate">From</label>
            <input
              id="fromDate"
              type="date"
              name="fromDate"
              [(ngModel)]="fromDate"
              [max]="toDate"
            />
          </div>
          <div class="rp-field">
            <label for="toDate">To</label>
            <input
              id="toDate"
              type="date"
              name="toDate"
              [(ngModel)]="toDate"
              [min]="fromDate"
            />
          </div>
        </div>

        <!-- Order category: admin always, user only when serviceType is 1 -->
        <ng-container *ngIf="showOrderCategory">
          <div class="rp-section"><span>Order category</span></div>
          <div class="rp-segment" role="radiogroup" aria-label="Order category">
            <button
              type="button"
              role="radio"
              [attr.aria-checked]="orderCategoryType === 2"
              [class.active]="orderCategoryType === 2"
              (click)="orderCategoryType = 2"
            >
              Perso
            </button>
            <button
              type="button"
              role="radio"
              [attr.aria-checked]="orderCategoryType === 3"
              [class.active]="orderCategoryType === 3"
              (click)="orderCategoryType = 3"
            >
              Insta
            </button>
          </div>
        </ng-container>

        <!-- Output -->
        <div class="rp-section"><span>Output</span></div>
        <div class="rp-segment" role="radiogroup" aria-label="Output type">
          <button
            type="button"
            role="radio"
            [attr.aria-checked]="selectedReportType === 'Table'"
            [class.active]="selectedReportType === 'Table'"
            (click)="selectedReportType = 'Table'"
          >
            Table
          </button>
          <button
            type="button"
            role="radio"
            [attr.aria-checked]="selectedReportType === 'Bar'"
            [class.active]="selectedReportType === 'Bar'"
            (click)="selectedReportType = 'Bar'"
          >
            Bar chart
          </button>
          <button
            type="button"
            role="radio"
            [attr.aria-checked]="selectedReportType === 'Pie'"
            [class.active]="selectedReportType === 'Pie'"
            (click)="selectedReportType = 'Pie'"
          >
            Pie chart
          </button>
        </div>

        <ng-container *ngIf="selectedReportType === 'Table'">
          <!-- Columns -->
          <div class="rp-section">
            <span>Columns</span>
            <button
              type="button"
              class="rp-link"
              (click)="
                selectAllOrderChecked = !selectAllOrderChecked;
                selectAllOrderCheckboxChanged()
              "
            >
              Toggle all
            </button>
          </div>
          <div class="rp-checks">
            <label class="rp-check rp-check-sm">
              <input
                type="checkbox"
                name="selectAllOrder"
                [(ngModel)]="selectAllOrderChecked"
                (change)="selectAllOrderCheckboxChanged()"
              />
              <span>Select all</span>
            </label>
            <label class="rp-check" *ngFor="let c of orderCheckboxes">
              <input
                type="checkbox"
                [name]="c.id"
                [(ngModel)]="c.checked"
                (change)="checkboxChanged()"
              />
              <span>{{ c.label }}</span>
            </label>
          </div>

          <!-- Order statuses -->
          <div class="rp-section">
            <span>Order statuses</span>
          </div>
          <div class="rp-checks">
            <label class="rp-check rp-check-sm">
              <input
                type="checkbox"
                name="selectAllStatus"
                [checked]="allSelected"
                (change)="toggleSelectAll($event)"
              />
              <span>Select all</span>
            </label>
            <label class="rp-check" *ngFor="let status of filteredStatuses">
              <input
                type="checkbox"
                [name]="'status-' + status.id"
                [checked]="selectedStatusIds.includes(status.id)"
                (change)="toggleSelection(status)"
              />
              <span>{{ status.name }}</span>
            </label>
          </div>
        </ng-container>

        <div class="rp-actions">
          <button
            type="button"
            class="rp-btn-primary"
            (click)="createReport()"
            [disabled]="isCreating"
          >
            {{ isCreating ? "Creating…" : "Create report" }}
          </button>
          <button
            type="button"
            class="rp-btn-ghost"
            (click)="navigatetoReports()"
          >
            Cancel
          </button>
        </div>
      </div>
    </section>

    <!-- ============ SAVED REPORTS ============ -->
    <section class="rp-card rp-saved">
      <div class="rp-card-head">Saved reports</div>

      <table class="rp-table">
        <thead>
          <tr>
            <th>Report</th>
            <th>Created</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let r of pagedReports">
            <td>
              <div class="rp-name">{{ r.name }}</div>
              <div class="rp-sub">{{ r.type }} · {{ r.bank }}</div>
            </td>
            <td class="rp-date">{{ r.createdAt | date: "dd MMM yyyy" }}</td>
            <td>
              <button type="button" class="rp-run" (click)="runSavedReport(r)">
                Run
              </button>
            </td>
          </tr>
          <tr *ngIf="savedReports.length === 0">
            <td colspan="3" class="rp-empty">
              No saved reports yet. Create one to see it here.
            </td>
          </tr>
        </tbody>
      </table>

      <div class="rp-pager">
        <div class="rp-rows">
          <span>Rows</span>
          <select
            [(ngModel)]="savedPageSize"
            name="savedPageSize"
            (change)="savedPage = 1"
          >
            <option [ngValue]="25">25</option>
            <option [ngValue]="50">50</option>
            <option [ngValue]="100">100</option>
          </select>
          <span class="rp-range"
            >{{ rangeStart }}–{{ rangeEnd }} of
            <b>{{ savedReports.length }}</b></span
          >
        </div>

        <div class="rp-pages">
          <button
            type="button"
            class="rp-page-btn"
            [disabled]="savedPage === 1"
            (click)="savedPage = savedPage - 1"
          >
            Prev
          </button>
          <button
            type="button"
            class="rp-page-num"
            *ngFor="let p of pageNumbers"
            [class.active]="p === savedPage"
            (click)="savedPage = p"
          >
            {{ p }}
          </button>
          <button
            type="button"
            class="rp-page-btn"
            [disabled]="savedPage === totalPages"
            (click)="savedPage = savedPage + 1"
          >
            Next
          </button>
        </div>
      </div>
    </section>
  </div>
</div>
