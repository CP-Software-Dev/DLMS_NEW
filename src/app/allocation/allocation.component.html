<div class="page">
    <div class="page-header">
        <div>
            <h1 class="page-title">Order allocation engine</h1>
            <p class="page-subtitle">
                Priority is data, not code. Adding a fourth partner for one bank is a row, never a release.
            </p>
        </div>
        <button type="button" class="btn-new-rule" (click)="addNewRules()">
            <span class="plus">+</span> New rule
        </button>
    </div>

    <div class="content-card">
        <nav>
            <div class="nav nav-tabs" id="nav-tab" role="tablist">
                <button class="nav-link active" id="Shipping-tab" data-bs-toggle="tab" data-bs-target="#Shipping"
                    type="button" role="tab" aria-controls="Shipping" aria-selected="true">Shipping rules</button>
                <button class="nav-link" id="Rules-tab" data-bs-toggle="tab" data-bs-target="#Rules"
                    type="button" role="tab" aria-controls="Rules" aria-selected="false">Rule testing</button>
            </div>
        </nav>

        <div class="tab-content" id="nav-tabContent">
            <div class="tab-pane fade show active" id="Shipping" role="tabpanel" aria-labelledby="Shipping-tab">
                <app-allocation-shippingrules
                    [showAddModal]="showAddRuleModal"
                    (modalClosed)="onModalClosed()">
                </app-allocation-shippingrules>
            </div>
            <div class="tab-pane fade" id="Rules" role="tabpanel" aria-labelledby="Rules-tab">
                <app-allocation-ruletesting></app-allocation-ruletesting>
            </div>
        </div>
    </div>
</div>
