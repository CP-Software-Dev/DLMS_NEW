<div class="card">
  <div class="page-head">
    <div class="page-head_text">
      <h2 class="page-title">Zone Master</h2>
    </div>

    <button type="button" class="btn-upload" (click)="openDialog()">
      <i class="ri-upload-2-line"></i> CSV Upload
    </button>
  </div>

  <div class="card-body">
    <div class="filter-bar">
      <div class="filter-field">
        <label for="sellerName" class="form-label">Courier</label>
        <select
          class="form-select form-select-sm"
          id="sellerName"
          [(ngModel)]="courierId"
        >
          <option value="" selected>Select Courier</option>
          <option *ngFor="let courier of courierData" [value]="courier.id">
            {{ courier.name }}
          </option>
        </select>
      </div>

      <div class="filter-field">
        <label for="pin" class="form-label">Pincode:</label>
        <input
          type="text"
          class="form-control form-control-sm"
          id="pin"
          [(ngModel)]="pincode"
          placeholder="Enter Pincode"
        />
      </div>

      <div class="filter-actions">
        <button class="btn-apply" type="button" (click)="applyFilters()">
          Apply
        </button>
        <button class="btn-clear" type="button" (click)="clearFilters()">
          Clear
        </button>
      </div>
    </div>

    <div class="table-row">
      <table class="table table-borderless zone-table">
        <thead class="table-head-hover">
          <tr>
            <th scope="col">Courier</th>
            <th scope="col">Pincode</th>
            <th scope="col">Zone</th>
            <th scope="col">TAT</th>
            <th scope="col">Serviceable</th>
            <th scope="col">Updated</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let data of pincodeData; let i = index">
            <td>
              <span class="cell-main">{{ data.courierName }}</span>
            </td>
            <td>
              <span class="cell-code">{{ data.pin }}</span>
            </td>
            <td>
              <span class="cap-pill" *ngIf="data.zone">{{ data.zone }}</span>
            </td>
            <td>
              <span class="cell-muted">{{ data.tat }}</span>
            </td>
            <td>
              <span class="cell-muted">not yet</span>
            </td>
            <td>
              <span class="cell-muted">{{
                data.createdAt | date: "dd-MM-yyyy"
              }}</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <app-paginator
      [length]="totalOrders"
      [pageSize]="pageSize"
      [pageSizeOptions]="[10, 20, 50, 100, 500, 1000]"
      [pageIndex]="pageIndex"
      (page)="handlePageEvent($event)"
    >
    </app-paginator>
  </div>
</div>
