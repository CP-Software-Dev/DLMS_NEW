<div class="card">
  <div class="card-head">
    <!-- Card-header elements -->

    <div class="row">
      <div class="col-md-6 col-sm-6">
        <h5>
          <i class="ri-checkbox-blank-fill" style="border: 2px solid black"></i>
          Zone Master
        </h5>
      </div>
      <div
        class="col-md-6 col-sm-6 d-flex justify-content-end align-items-center"
      >
        <button class="btn btn-outline-dark btn-sm me-3" (click)="openDialog()">
          <i class="ri-upload-2-line"></i> CSV Upload
        </button>
        <button
          class="btn btn-outline-dark btn-sm me-3"
          (click)="toggleFiltersForm()"
        >
          <i [class]="buttonIcon"></i> {{ buttonText }}
        </button>
      </div>
    </div>

    <div class="form" *ngIf="showFiltersForm" style="margin-top: 30px">
      <div class="row">
        <!-- Phone -->
        <div class="col-md-3">
          <div class="mb-2">
            <label for="sellerName" class="form-label">Courier</label>
            <select
              class="form-select form-select-sm mb-2"
              id="sellerName"
              [(ngModel)]="courierId"
            >
              <option value="" selected>Select Courier</option>
              <option *ngFor="let courier of courierData" [value]="courier.id">
                {{ courier.name }}
              </option>
            </select>
          </div>
        </div>

        <div class="col-md-3">
          <div class="mb-2">
            <label for="pin" class="form-label">Pincode:</label>
            <input
              type="text"
              class="form-control form-control-sm"
              id="pin"
              [(ngModel)]="pincode"
              placeholder="Enter Pincode"
            />
          </div>
        </div>

        <div class="col-md-3 d-flex align-items-end">
          <div class="button-grp mb-2 d-flex justify-content-start">
            <button
              class="btn btn-outline-dark btn-sm me-3"
              type="button"
              style="
                background-color: rgb(5, 114, 209);
                font-size: small;
                color: white;
              "
              (click)="applyFilters()"
            >
              Apply
            </button>
            <button
              class="btn btn-danger btn-sm me-3"
              style="font-size: small; box-shadow: none"
              (click)="clearFilters()"
            >
              Clear
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="card-body">
    <div class="row">
      <div class="table-row">
        <table class="table">
          <thead class="table-head-hover">
            <th scope="col">ID</th>
            <th scope="col">Courier</th>
            <th scope="col">Pincode</th>
            <th scope="col">Zone</th>
            <th scope="col">TAT</th>
            <th scope="col">Created By</th>
            <th scope="col">Created At</th>
          </thead>

          <tbody>
            <tr *ngFor="let data of pincodeData; let i = index">
              <td>{{ i + 1 }}</td>
              <td>{{ data.courierName }}</td>
              <td>{{ data.pin }}</td>
              <td>{{ data.zone }}</td>
              <td>{{ data.tat }}</td>
              <td>{{ data.createdBy }}</td>
              <td>{{ data.createdAt | date: "dd-MM-yyyy" }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Pagination  -->

    <app-paginator
      [length]="totalOrders"
      [pageSize]="pageSize"
      [pageSizeOptions]="[10, 20, 50, 100, 500, 1000]"
      [pageIndex]="pageIndex"
      (page)="handlePageEvent($event)"
    >
    </app-paginator>
  </div>
</div>
