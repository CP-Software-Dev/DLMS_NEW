<div class="card">
    <div class="card-head">

        <!-- Card-header elements -->

        <div class="row">
            <div class="col-md-6 col-sm-6">
                <h5><i class="ri-checkbox-blank-fill" style="border: 2px solid black;"></i> Remake Data</h5>
            </div>
            <div class="col-md-6 col-sm-6 d-flex justify-content-end align-items-center">
                <button class="btn btn-outline-dark btn-sm me-3" (click)=" toggleFiltersForm()">
                    <i [class]="buttonIcon"></i> {{ buttonText }}
                </button>
            </div>
        </div>

        <div class="form" *ngIf="showFiltersForm" style="margin-top: 30px;">

            <div class="row">

                <div class="col-md-3">
                    <div class="mb-2">
                        <label for="filterCriteria" class="form-label">From Date:</label>
                        <!-- <app-datepicker (dateRangeSelected)="onDateRangeSelected($event)"></app-datepicker> -->
                        <app-date-picker-invoice [selectedRange]="selectedDateRange"
                            (dateRangeSelected)="onDateRangeSelected($event)"></app-date-picker-invoice>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="mb-2">
                        <label for="kit" class="form-label">kit Number:</label>
                        <input type="text" class="form-control form-control-sm" id="kit" [(ngModel)]="kitnumber"
                            placeholder="Enter Kit Number">
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="mb-2">
                        <label for="lotID" class="form-label">Lot ID:</label>
                        <input type="text" class="form-control form-control-sm" id="lotID" [(ngModel)]="lotID"
                            placeholder="Enter Lot ID">
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="mb-2">
                        <label for="sellerName" class="form-label">Bank Name</label>
                        <select class="form-select form-select-sm mb-2" id="sellerName" [(ngModel)]="sellerId">
                            <option value="" selected disabled>Select Bank</option>
                            <option *ngFor="let seller of sellerData" [value]="seller.id">{{ seller.name }}</option>
                        </select>
                    </div>
                </div>



            </div>

            <div class="row">
                <div class="col-md-3 d-flex align-items-end">
                    <div class="button-grp mb-2 d-flex justify-content-start">
                        <button class="btn btn-outline-dark btn-sm me-3" type="button"
                            style="background-color: rgb(5, 114, 209); font-size: small; color: white;"
                            (click)="applyFilters()">Apply</button>
                        <button class="btn btn-danger btn-sm me-3" style="font-size: small; box-shadow: none;"
                            (click)="clearFilters()">Clear</button>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <div class="card-body">

        <div class="row">


            <div class="table-row">
                <table class="table">
                    <thead class="table-head-hover">
                        <th scope="col">ID</th>
                        <th scope="col">Order ID</th>
                        <th scope="col">Kit Number</th>
                        <th scope="col">Lot</th>
                        <th scope="col">Company</th>
                        <th scope="col">Customer</th>
                        <th scope="col">Date</th>
                    </thead>

                    <tbody>
                        <tr *ngFor="let data of remakeData; let i = index">
                            <td>{{ i + 1}}</td>
                            <td>{{ data.orderID}}</td>
                            <td>{{ data.kitNumber}}</td>
                            <td>{{ data.lotId}}</td>
                            <td>{{ data.company}}</td>
                            <td>{{ data.customer}}</td>
                            <td>{{ data.date.split(' ')[0] }}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Pagination  -->

        <app-paginator [length]="totalOrders" [pageSize]="pageSize" [pageSizeOptions]="[10, 20, 50, 100 , 500 , 1000]"
            [pageIndex]="pageIndex" (page)="handlePageEvent($event)">
        </app-paginator>

    </div>
</div>
