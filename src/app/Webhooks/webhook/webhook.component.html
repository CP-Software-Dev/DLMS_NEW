<div class="card">
  <div class="page-head">
    <div class="page-head_text">
      <h2 class="page-title">Webhooks</h2>
      <p class="page-sub">
        Webhooks are event notifications sent to URLs of your choice. Use
        these to receive real time shipment updates in your system.
      </p>
    </div>

    <button type="button" class="btn-add" (click)="navigateToAddWebhook()">
      <i class="ri-add-line"></i> New Webhook
    </button>
  </div>

  <div class="card-body">
    <div class="table-row">
      <table class="table table-borderless webhook-table">
        <thead class="table-head-hover">
          <tr>
            <th scope="col">Name</th>
            <th scope="col">User</th>
            <th scope="col" class="url-col">URL</th>
            <th scope="col">Type</th>
            <th scope="col">Status</th>
            <th scope="col">Action</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let webhook of webhookdata; let i = index">
            <td>
              <div class="name-cell">
                <span class="dot" [ngClass]="'dot--c' + (i % 6)"></span>
                <span class="cell-name">{{ webhook.webhookName }}</span>
              </div>
            </td>

            <td>
              <span class="cell-muted">{{ webhook.sellerName }}</span>
            </td>

            <td class="url-col">
              <span class="cell-muted">{{ webhook.webhookURL }}</span>
            </td>

            <td>
              <span class="cap-pill">Booking</span>
            </td>

            <td>
              <span
                class="status-pill"
                [ngClass]="webhook.status === 'Active' ? 'status-pill--on' : 'status-pill--off'"
              >
                <span class="status-dot"></span>
                {{ webhook.status }}
              </span>
            </td>

            <td>
              <button
                type="button"
                class="view-btn"
                (click)="editWebhook(webhook.sellerID)"
              >
                <i class="ri-pencil-fill"></i> Edit
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
