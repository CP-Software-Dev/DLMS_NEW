<div class="card">
  <div class="card-head">
    <div class="head-row">
      <div>
        <h5>Financial institutions</h5>
      </div>
      <button class="head-btn head-btn--primary" (click)="openDialog()">
        <i class="bi-plus"></i> Add Bank
      </button>
    </div>
  </div>

  <div class="card-body">
    <div class="table-row">
      <table class="table">
        <colgroup>
          <col class="col-id" />
          <col class="col-name" />
          <col class="col-sales" />
          <col class="col-couriers" />
          <col class="col-created" />
          <col class="col-action" />
        </colgroup>
        <thead class="table-head-hover">
          <tr>
            <th scope="col">Bank ID</th>
            <th scope="col">Bank Name</th>
            <th scope="col">Sales Person</th>
            <th scope="col">Couriers</th>
            <th scope="col">Created By</th>
            <th scope="col" class="col-action-cell">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let data of bankData">
            <td>{{ data.id }}</td>
            <td><span class="cell-main">{{ data.name }}</span></td>
            <td>{{ data.salesPersonName }}</td>
            <td>{{ getCouriers(data.couriers) }}</td>
            <td>{{ data.createdBy }}</td>
            <td class="col-action-cell">
              <button class="view-btn" (click)="editDetails(data)">
                <i class="ri-pencil-fill"></i> Edit
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
