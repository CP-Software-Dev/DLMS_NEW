<div class="dlg">
  <div class="dlg-head">
    <div class="dlg-titles">
      <h5>Add New Institution</h5>
      <p class="dlg-sub" *ngIf="isBankNameDisabled">{{ bankName }}</p>
    </div>
    <button type="button" class="close-btn" (click)="closeDialog()" aria-label="Close">
      <i class="ri-close-line"></i>
    </button>
  </div>

  <div class="dlg-body">
    <div class="field">
      <label class="form-label">Bank Name</label>
      <input type="text" name="Name" [(ngModel)]="bankName" class="form-control "
        placeholder="Enter Bank Name" id="name" [disabled]="isBankNameDisabled" autocomplete="off"
        maxlength="30" (keypress)="allowOnlyAlphanumeric($event)">
    </div>

    <div class="field">
      <label class="form-label">Sales Person</label>
      <select class="form-select form-select-sm" [(ngModel)]="personID">
        <option value="" selected>Select Sales Person</option>
        <option *ngFor="let person of salesPerson" [value]="person.id">{{ person.name }}</option>
      </select>
    </div>

    <div class="field">
      <label class="form-label">Plan</label>
      <select class="form-select form-select-sm" id="activeplan" [(ngModel)]="activeplan">
        <option value="0" disabled selected>Select Plan:</option>
        <option value="1">Insta & Perso</option>
        <option value="2">Perso</option>
        <option value="3">Insta</option>
      </select>
    </div>

    <div class="courier-list">
      <div class="courier-row" *ngFor="let row of courierRows">
        <div class="courier-item" *ngFor="let courierItem of row">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" [id]="'courier' + courierItem.id"
              [value]="courierItem.id" (change)="onCourierCheckboxChange($event)"
              [checked]="isCourierSelected(courierItem.id)">
            <label class="form-check-label" [for]="'courier' + courierItem.id">
              {{ courierItem.name }}
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="dlg-foot">
    <button type="button" class="cancel-btn" (click)="closeDialog()">Close</button>
    <button type="button" class="submit-btn" (click)="addBank()">
      <i class="ri-check-line"></i> Save
    </button>
  </div>
</div>
