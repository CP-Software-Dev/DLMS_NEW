<div class="card">
    <div class="card-head">
        <div class="row">
            <div class="col">
                <h5>Add Settings</h5>
                <div class="small text-muted mt-2">Fill these details to add/update courier.</div>
            </div>
        </div>
    </div>
    <div class="card-body">
        <div class="row">
            <div class="col-12 mb-2">
                <label for="weight" class="form-label">Weight
                </label>
                <input type="text" class="form-control form-control-sm" id="weight" placeholder="Enter Weight">
            </div>
            <div class="col-12 mb-2">
                <label for="length" class="form-label">Length
                </label>
                <input type="text" class="form-control form-control-sm" id="length" placeholder="Enter Length">
            </div>
            <div class="col-12 mb-2">
                <label for="breadth" class="form-label">Breadth
                </label>
                <input type="text" class="form-control form-control-sm" id="breadth" placeholder="Enter Breadth">
            </div>           
            <div class="col-12 mb-2">
                <label for="height" class="form-label">Height
                </label>
                <input type="text" class="form-control form-control-sm" id="height" placeholder="Enter Height">
            </div>
            <div class="col-2 mt-3">
                <button class="btn btn-sm btn-primary" (click) = "onSubmit()">Save</button>
            </div>
        </div>
        
    </div>
</div>
