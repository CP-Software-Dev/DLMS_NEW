<div class="card">
    <div class="card-head">
        <div class="row">
            <div class="col-md-6 col-sm-6">
                <h5><i class="ri-checkbox-blank-fill" style="border: 2px solid black;"></i> Courier's List</h5>
            </div>
            <div class="col-md-6 col-sm-6 d-flex justify-content-end align-items-center">
                <button class="btn btn-outline-dark btn-sm me-3" (click)="navigateToCourierPage()"> <i
                        class="bi-plus"></i>
                    New Courier</button>
            </div>
        </div>

    </div>
    <div class="card-body">
        <div class="table-row">
            <table class="table">
                <thead class="table-head-hover">
                    <tr>
                        <!-- <th scope="col">Courier Image</th> -->
                        <th scope="col">Courier ID</th>
                        <th scope="col">Courier Name</th>
                        <th scope="col">Courier Code</th>
                        <th scope="col">Remaining AWB</th>
                        <th scope="col">Institution</th>
                        <th scope="col">Status</th>
                        <th scope="col">Action</th>
                    </tr>

                </thead>
                <tbody>
                    <tr *ngFor="let entry of getCourierEntriesForCurrentPage()">
                        <td>{{entry.courierID}}</td>
                        <td>{{ entry.courierName }}</td>
                        <td>{{ entry.courierCode }}</td>
                        <td>{{ entry.courierCode === 'INPOST' ? entry.remainingCount : '--' }}</td>
                        <td>{{ entry.institution || '--' }}</td>
                        <td>Active</td>
                        <td>
                            <button *ngIf="entry.courierCode === 'INPOST'" class="btn btn-sm btn-primary"
                                (click)="awbDialog(entry)">
                                <i class="ri-pencil-fill"></i> Edit
                            </button>
                        </td>

                    </tr>
                </tbody>
            </table>
        </div>
        <app-paginator [length]="courierEntries.length" [pageSize]="10" [pageSizeOptions]="[10, 20, 50]"
            (page)="handlePageEvent($event)"></app-paginator>
    </div>
</div>
