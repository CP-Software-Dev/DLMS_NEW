<div class="card">
  <!-- Page header -->
  <div class="page-head">
    <div class="page-head_text">
      <h2 class="page-title">Couriers</h2>
      <p class="page-sub">Courier partners available to integrate.</p>
    </div>

    <button type="button" class="btn-back" (click)="navigateTOCourierlist()">
      <i class="ri-arrow-left-line"></i> Back
    </button>
  </div>

  <div class="card-body">
    <div class="courier-grid">
      <div class="courier-card" *ngFor="let courier of Couriers">
        <div class="courier-image">
          <img [src]="courier.imageUrl" [alt]="courier.name" />
        </div>

        <div class="courier-footer">
          <h3 class="courier-name">{{ courier.name }}</h3>

          <span class="status-pill" *ngIf="courier.status === 1">
            <span class="status-dot"></span>
            Integrated
          </span>

          <button
            type="button"
            *ngIf="courier.status === 0"
            class="btn-integrate"
            (click)="addCourier()"
          >
            Integrate
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
