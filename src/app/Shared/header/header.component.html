<div class="head" [ngClass]="getHeadClass()">
    <nav class="app-header">

        <!-- Left: page title -->
        <div class="app-header-left">
            <h5 class="app-header-title">{{ pageTitle }}</h5>
        </div>

        <!-- Right: search + profile -->
        <div class="app-header-right">

            <!-- Search bar -->
            <div class="app-search">

                <div class="app-search-type dropdown">
                    <button
                        class="app-search-type-btn"
                        type="button"
                        id="moreDropdown"
                        data-bs-toggle="dropdown"
                        aria-expanded="false"
                    >
                        <i class="ri-search-line"></i>
                    </button>
                    <ul class="dropdown-menu" aria-labelledby="moreDropdown">
                        <li *ngFor="let option of options">
                            <button
                                class="dropdown-item"
                                [class.active]="selectedOption === option"
                                (click)="selectOption(option)"
                            >
                                {{ option }}
                            </button>
                        </li>
                    </ul>
                </div>

                <input
                    #orderInput
                    type="text"
                    class="app-search-input"
                    placeholder="Search AWB, order, kit or page"
                    autocomplete="off"
                    maxlength="20"
                    (keyup.enter)="searchOrder(orderInput.value)"
                />

                <button
                    type="button"
                    class="app-search-kbd"
                    (click)="searchOrder(orderInput.value)"
                >
                    &#8984;K
                </button>
            </div>

            <!-- Profile -->
            <div class="app-profile" *ngIf="username && role">

                <div
                    class="app-help-wrap d-flex align-items-center justify-content-end cursor-pointer"
                >
                    <app-hellpbtn *ngIf="isNotRoleOne()"></app-hellpbtn>
                </div>

                <div
                    class="app-profile-info cursor-pointer"
                    (click)="toggleDropdown($event)"
                >
                    <div class="app-profile-text">
                        <div class="app-profile-name">{{ fName }} {{ lName }}</div>
                        <div class="app-profile-role">
                            {{ role == 1 ? 'Super Admin' : role == 2 ? 'Admin' : role == 3 ? 'Client' : role == 4 ? 'Client' : 'Unknown Role' }}
                        </div>
                    </div>
                    <div class="app-profile-avatar">
                        {{ (fName ? fName.charAt(0) : '') + (lName ? lName.charAt(0) : '') }}
                    </div>
                </div>

                <ul
                    class="dropdown-menu"
                    [ngClass]="{ show: isDropdownOpen }"
                    style="border: 1px solid #95aac9; right: 0; left: auto; cursor: pointer;"
                >
                    <li><a class="dropdown-item" (click)="chnagePassword()">Change Password</a></li>
                    <li><a class="dropdown-item" (click)="logout()">Log Out</a></li>
                </ul>
            </div>

        </div>

    </nav>
</div>
