<div class="paginator">
    <div class="left-section">
        <span class=" pagination-info mr-2">Rows</span>
        <select (change)="onPageSizeChange($event)">
            <option *ngFor="let size of pageSizeOptions" [value]="size" >{{ size }}</option>
        </select>
        <div class="pagination-info">
             {{ startIndex + 1 }}-{{ endIndex }} of <span style="font-weight:900;color: black; margin-right: 3px;">{{ length }}</span> 
        </div>
    </div>
    <div class="pagination-buttons" *ngIf="shouldShowPagination">
        <button (click)="goToPage(pageIndex - 1)" style="text-align: center;" [disabled]="pageIndex === 0">
           Prev
        </button>
        <ng-container *ngFor="let page of pages">
            <span (click)="goToPage(page)" [class.active]="page === pageIndex">
                {{ page + 1 }}
            </span>
        </ng-container>
        <button (click)="goToPage(pageIndex + 1)" style="text-align: center;" [disabled]="pageIndex >= totalPages - 1">
            Next
        </button>
    </div>

    <div class="page-input"  *ngIf="shouldShowPagination">
        <input type="number" [(ngModel)]="inputPageNumber" min="1" max="{{ totalPages }}"  [maxlength]="maxDigits(totalPages)" pattern="\d{1,{{ maxDigits(totalPages) }}}" placeholder="" (input)="validateInput($event)">
        <button (click)="goToInputPage()">Jump to Page</button>
        <span style="margin-left: 5px;color: rgb(124, 122, 122);" >of <span  style="font-weight:900;color: black; margin-right: 3px; font-size: 12px;">{{totalPages}}</span> pages</span>
    </div>
</div>
