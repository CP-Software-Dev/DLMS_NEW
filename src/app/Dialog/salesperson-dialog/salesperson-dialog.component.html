<div class="dlg">
  <div class="dlg-head">
    <div class="dlg-titles">
      <h5>Add Sales Person</h5>
      <p class="dlg-sub" *ngIf="data">{{ data.name }}</p>
    </div>
    <button type="button" class="close-btn" (click)="closeDialog()" aria-label="Close">
      <i class="ri-close-line"></i>
    </button>
  </div>

  <div class="dlg-body">
    <div class="form-grid">
      <div class="field full">
        <label class="form-label">Full Name</label>
        <input type="text" [(ngModel)]="Name" name="firstName" class="form-control "
          placeholder="Enter Your Name" id="fname" autocomplete="off" maxlength="30" (keypress)="allowOnlyAlphanumeric($event)">
        <span *ngIf="invalidname" class="invalid-email text-danger">
          Only Alphapets and space is allowed.
        </span>
      </div>

      <div class="field">
        <label class="form-label">Email</label>
        <input type="email" [(ngModel)]="email" name="emailAddress" class="form-control "
          placeholder="Enter Email id" id="email" autocomplete="off" maxlength="50">
        <span *ngIf="invalidemail" class="invalid-email text-danger" >
          Invalid Email.
        </span>
      </div>

      <div class="field">
        <label class="form-label">Contact No.</label>
        <input type="text" [(ngModel)]="contact" name="contact" class="form-control "
          placeholder="Enter Your Number" id="phone" autocomplete="off" maxlength="15" (keypress)="allowOnlyNumeric($event)">
        <span *ngIf="invalidphone" class="invalid-email text-danger">
          Invalid Contact.
        </span>
      </div>
    </div>
  </div>

  <div class="dlg-foot">
    <button type="button" class="cancel-btn" (click)="closeDialog()">Close</button>
    <button type="button" class="submit-btn" (click)="user()">
      <i class="ri-check-line"></i> Save
    </button>
  </div>
</div>
