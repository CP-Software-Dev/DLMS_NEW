<div class="card" [@fadeSlideInOut]>
  <div class="drawer-head">
    <div class="drawer-head_text">
      <h3 class="drawer-title">Add Employee</h3>
    </div>
    <button type="button" class="close-btn" (click)="closeDialog()">
      <i class="ri-close-line"></i>
    </button>
  </div>

  <div class="drawer-body">
    <div class="field-grid">
      <div class="field">
        <label class="form-label">First Name <span class="req">*</span></label>
        <input
          type="text"
          name="Name"
          [(ngModel)]="newUserObj.firstName"
          (ngModelChange)="validateInput()"
          [ngClass]="{ 'empty-input': formSubmitted && !newUserObj.firstName }"
          class="form-control"
          placeholder="Enter First Name"
          id="fname"
          autocomplete="off"
          maxlength="30"
          (keypress)="allowOnlyAlphanumeric($event)"
        />
        <span
          *ngIf="newUserObj.firstName && newUserObj.firstName.length >= 30"
          class="text-danger"
        >
          Maximum length of 30 characters reached.
        </span>
      </div>

      <div class="field">
        <label class="form-label">Last Name <span class="req">*</span></label>
        <input
          type="text"
          name="Name"
          [(ngModel)]="newUserObj.lastName"
          (ngModelChange)="validateInput()"
          [ngClass]="{ 'empty-input': formSubmitted && !newUserObj.lastName }"
          class="form-control"
          placeholder="Enter Last Name"
          id="lname"
          autocomplete="off"
          maxlength="30"
          (keypress)="allowOnlyAlphanumeric($event)"
        />
        <span
          *ngIf="newUserObj.lastName && newUserObj.lastName.length >= 30"
          class="text-danger"
        >
          Maximum length of 30 characters reached.
        </span>
      </div>

      <div class="field">
        <label class="form-label">Employee Email <span class="req">*</span></label>
        <input
          type="email"
          name="emailAddress"
          [(ngModel)]="newUserObj.emailAddress"
          (ngModelChange)="resetEmailValidation()"
          [ngClass]="{ 'empty-input': formSubmitted && !newUserObj.emailAddress }"
          class="form-control"
          placeholder="Enter Email id"
          id="email"
          autocomplete="off"
          maxlength="100"
        />
        <span *ngIf="formSubmitted && invalidemail" class="invalid-email text-danger">
          Invalid Email.
        </span>
        <span
          *ngIf="newUserObj.emailAddress && newUserObj.emailAddress.length >= 100"
          class="text-danger"
        >
          Maximum length of 100 characters reached.
        </span>
      </div>

      <div class="field">
        <label class="form-label">Contact No. <span class="req">*</span></label>
        <input
          type="text"
          name="contact"
          [(ngModel)]="newUserObj.contact"
          (ngModelChange)="resetPhoneValidation()"
          [ngClass]="{ 'empty-input': formSubmitted && !newUserObj.contact }"
          class="form-control"
          placeholder="Enter Your Number"
          id="phone"
          autocomplete="off"
          maxlength="15"
          (keypress)="allowOnlyNumeric($event)"
        />
        <span *ngIf="formSubmitted && invalidphone" class="invalid-email text-danger">
          Invalid Contact Number.
        </span>
        <span
          *ngIf="newUserObj.contact && newUserObj.contact.length >= 15"
          class="text-danger"
        >
          Maximum length of 15 reached.
        </span>
      </div>

      <div class="field field--full">
        <label class="form-label">User Code <span class="req">*</span></label>
        <div class="input-wrap">
          <input
            type="text"
            name="employee-name"
            [(ngModel)]="newUserObj.username"
            (ngModelChange)="resetUserValidation()"
            [ngClass]="{ 'empty-input': formSubmitted && !newUserObj.username }"
            class="form-control"
            placeholder="Enter User Name"
            id="usercode"
            autocomplete="off"
            maxlength="30"
          />
          <i
            class="bi bi-info-circle info-icon"
            data-bs-toggle="tooltip"
            data-bs-placement="bottom"
            title="Usercode should contain only lowercase letters and numbers with no special characters."
          ></i>
        </div>
        <span *ngIf="formSubmitted && invaliduser" class="invalid-email text-danger">
          Only lowercase alphabets and numbers are allowed.
        </span>
        <span
          *ngIf="newUserObj.username && newUserObj.username.length >= 30"
          class="text-danger"
        >
          Maximum length of 30 reached.
        </span>
      </div>
    </div>

    <div class="section-title">
      <span>Permissions</span>
      <span class="section-line"></span>
    </div>

    <div class="perm-grid">
      <label class="perm-item" for="orders">
        <input
          type="checkbox"
          class="form-check-input"
          id="orders"
          [(ngModel)]="newUserObj.hasOrders"
          (ngModelChange)="updatePermission('hasOrders', $event)"
        />
        <span>Manage Orders</span>
      </label>

      <label class="perm-item" for="shipments">
        <input
          type="checkbox"
          class="form-check-input"
          id="shipments"
          [(ngModel)]="newUserObj.hasShipment"
          (ngModelChange)="updatePermission('hasShipment', $event)"
        />
        <span>Manage Shipment</span>
      </label>

      <label class="perm-item" for="ndr">
        <input
          type="checkbox"
          class="form-check-input"
          id="ndr"
          [(ngModel)]="newUserObj.hasNdr"
          (ngModelChange)="updatePermission('hasNdr', $event)"
        />
        <span>Manage NDR</span>
      </label>

      <label class="perm-item" for="rto">
        <input
          type="checkbox"
          class="form-check-input"
          id="rto"
          [(ngModel)]="newUserObj.hasRto"
          (ngModelChange)="updatePermission('hasRto', $event)"
        />
        <span>Manage RTO</span>
      </label>

      <label class="perm-item" for="reports">
        <input
          type="checkbox"
          class="form-check-input"
          id="reports"
          [(ngModel)]="newUserObj.hasReports"
          (ngModelChange)="updatePermission('hasReports', $event)"
        />
        <span>Manage Reports</span>
      </label>
    </div>
  </div>

  <div class="drawer-foot">
    <button type="button" class="btn-cancel" (click)="closeDialog()">Close</button>
    <button type="button" class="btn-save" (click)="user()">Save</button>
  </div>
</div>
