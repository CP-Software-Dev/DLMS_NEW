<div class="card confirm-card" [@fadeSlideInOut]>

    <div class="card-body text-center">
        <div class="icon-wrapper mb-3">
            <i class="ri-error-warning-fill"></i>
        </div>

        <!-- Heading -->
        <h5 class="fw-bold mb-2">Confirm Remake</h5>

        <!-- Message -->
        <p class="text-muted mb-0">
            Are you sure you want to remake the selected orders?
        </p>
    </div>

    <div class="card-footer bg-white border-0 pb-4">
        <div class="d-flex justify-content-center gap-3">

            <button class="btn btn-success btn-sm px-4"
                (click)="confirmSubmit()">
                <i class="ri-check-line me-1"></i> Yes
            </button>

            <button class="btn btn-outline-danger btn-sm px-4"
                (click)="cancelConfirm()">
                <i class="ri-close-line me-1"></i> No
            </button>

        </div>
    </div>
