<div class="card" [@fadeSlideInOut]>
  <div class="drawer-head">
    <div class="drawer-head_text">
      <h3 class="drawer-title">Zone Master Upload</h3>
    </div>
    <button type="button" class="close-btn" (click)="closeDialog()">
      <i class="ri-close-line"></i>
    </button>
  </div>

  <div class="drawer-body">
    <div class="field">
      <label for="sellerName" class="form-label">Courier</label>
      <select
        class="form-select form-select-sm"
        id="sellerName"
        [(ngModel)]="courierId"
      >
        <option value="" selected>Select Courier</option>
        <option *ngFor="let courier of courierData" [value]="courier.id">
          {{ courier.name }}
        </option>
      </select>
    </div>

    <div class="section-title">
      <span>File</span>
      <span class="section-line"></span>
    </div>

    <div
      class="dropzone"
      [class.drag-over]="isDragOver"
      [class.has-file]="fileSelected"
      [class.invalid]="fileInvalid"
      role="button"
      tabindex="0"
      (click)="fileInput.click()"
      (keydown.enter)="fileInput.click()"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)"
    >
      <input
        #fileInput
        type="file"
        accept=".csv"
        style="display: none"
        (change)="onFileSelected($event)"
      />

      <div class="drop-icon">
        <i [class]="fileSelected ? 'ri-file-text-line' : 'ri-upload-2-line'"></i>
      </div>

      <ng-container *ngIf="!fileSelected; else picked">
        <div class="drop-title">Drop the CSV file here</div>
        <div class="drop-sub">or click to browse · .csv only</div>
      </ng-container>

      <ng-template #picked>
        <div class="drop-title">{{ selectedFileName }}</div>
        <div class="drop-sub">
          Ready to upload
          <button
            type="button"
            class="remove-btn"
            (click)="clearFile(fileInput); $event.stopPropagation()"
          >
            Remove
          </button>
        </div>
      </ng-template>
    </div>

    <div *ngIf="fileInvalid" class="error-text">
      Invalid file format. Please select a .csv file.
    </div>

    <div class="section-title section-title--gap">
      <span>Expected format</span>
      <a
        class="btn-sample"
        href="/assets/File_format/Sample_Zone_Master.csv"
        download="Sample_Zone_Master.csv"
        ><i class="ri-download-2-fill"></i> Download CSV Format</a
      >
      <span class="section-line"></span>
    </div>
  </div>

  <div class="drawer-foot">
    <button type="button" class="btn-cancel" (click)="closeDialog()">
      Close
    </button>
    <button
      type="button"
      class="btn-save"
      (click)="uploadFile()"
      [disabled]="!fileSelected"
    >
      <i class="ri-upload-2-line"></i> Upload
    </button>
  </div>
</div>
