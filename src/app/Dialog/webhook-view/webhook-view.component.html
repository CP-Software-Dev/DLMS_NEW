  <div class="card-head">
    <div class="row" style="margin-bottom: 0px">
      <div class="col-8">
        <h3>{{ orderID }}</h3>
      </div>
      <div class="col header-actions">
        <button class="export-btn status-btn">
          <span class="dot-pill"></span>
          <span class="status_text">{{ shipmentStatus }}</span>
        </button>
        <i class="close-icon ri-close-fill" (click)="closeDialog()"></i>
      </div>
    </div>
    <div class="row1">
      <div class="order">
        <h6>{{ company }}</h6>
      </div>
    </div>
  </div>
  <!-- AWB Status section -->
  <div class="section-block">
    <!-- <h6 class="section-title">AWB Status</h6> -->
    <app-awbstatus [awbInput]="awb"></app-awbstatus>
  </div>

  <!-- Shipment Details section -->
  <div class="section-block">
    <app-shipmentdetails
      [orderIDInput]="orderID.toString()"
    ></app-shipmentdetails>
  </div>

  <!-- Sab kuch is ek hi scrollable body ke andar -->
  <div class="card-body">
    <table class="table">
      <thead class="table-head-hover">
        <tr>
          <th scope="col">Status Paushed</th>
          <th scope="col">Sent</th>
          <th scope="col">Tries</th>
          <th scope="col">Result</th>
          <th scope="col"></th>
        </tr>
      </thead>

      <tbody *ngFor="let journey of JourneyData">
        <tr>
          <td>{{ journey.shipmentStatus }}</td>
          <td>{{ journey.eventDateTime }}</td>
          <!-- <td>{{ journey.createdAt }}</td> -->
          <td>Tries</td>
          <!-- <td>{{ journey.isWebhookSent === "1" ? "Sent" : "Not Sent" }}</td> -->
          <td>
            <!-- Delivered -->
            <span
              *ngIf="journey.isWebhookSent === '1'"
              class="status-pill delivered"
            >
              <span class="status-dot"></span>
              Delivered
            </span>

            <!-- Give Up + Send -->
            <ng-container *ngIf="journey.isWebhookSent === '2'">
              <span class="status-pill give-up">
                <span class="status-dot"></span>
                Give Up
              </span>

              <button
                class="btn statusbtn btn-sm ms-2"
                style="cursor: pointer"
                (click)="sendWebhook(journey.id)"
              >
                Send
              </button>
            </ng-container>

            <!-- Send -->
            <button
              *ngIf="
                journey.isWebhookSent !== '1' && journey.isWebhookSent !== '2'
              "
              class="btn statusbtn btn-sm"
              style="cursor: pointer"
              (click)="sendWebhook(journey.id)"
            >
              Send
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="card-footer">
    <!-- <button class="footer-btn-outline" (click)="exportExcel()">
      <i class="ri-upload-2-line" style="margin-right: 5px"></i>Export
    </button> -->
    <button class="footer-btn-outline" (click)="copyToClipboard(awb)">
      <i class="ri-file-copy-line copy-icon"></i>
      Copy AWB
    </button>
    <button class="footer-btn-solid" (click)="closeDialog()">Close</button>
  </div>
</div>
