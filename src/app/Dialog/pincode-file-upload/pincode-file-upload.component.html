<div class="upload-card">
  <div class="upload-head">
    <h5>Pincode Master Upload</h5>
    <button type="button" class="close-btn" (click)="closeDialog()" aria-label="Close">
      <i class="ri-close-line"></i>
    </button>
  </div>

  <div class="upload-body">
    <div class="section-label">
      <span>FILE</span>
      <span class="line"></span>
    </div>

    <input
      #fileInput
      type="file"
      accept=".csv"
      hidden
      (change)="onFileSelected($event)"
    />

    <div
      class="drop-zone"
      [class.dragging]="isDragging"
      [class.has-file]="fileSelected"
      (click)="fileInput.click()"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)"
    >
      <div class="drop-icon"><i class="ri-upload-2-line"></i></div>

      <ng-container *ngIf="!fileSelected; else fileInfo">
        <div class="drop-title">Drop the CSV file here</div>
        <div class="drop-sub">or click to browse · .csv only</div>
      </ng-container>

      <ng-template #fileInfo>
        <div class="drop-title">{{ selectedFileName }}</div>
        <div class="drop-sub">Click to change file</div>
      </ng-template>
    </div>

    <div *ngIf="fileInvalid" class="error-text">
      Invalid file format. Please select a .csv file.
    </div>

    <div class="section-label">
      <span>EXPECTED FORMAT</span>
      <a
        class="download-btn"
        href="/assets/File_format/Sample_pincode_master.csv"
        download="Sample_Pincode_Master.csv"
      >
        <i class="ri-download-2-line"></i> Download CSV Format
      </a>
      <span class="line"></span>
    </div>
  </div>

  <div class="upload-foot">
    <button type="button" class="btn-close-dialog" (click)="closeDialog()">Close</button>
    <button
      type="button"
      class="btn-upload"
      (click)="uploadFile()"
      [disabled]="!fileSelected || uploading"
    >
      <i class="ri-upload-2-line"></i> Upload
    </button>
  </div>
</div>
