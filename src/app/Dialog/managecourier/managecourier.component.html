<div class="card" [@fadeSlideInOut]>
  <!-- Header -->
  <div class="drawer-head">
    <div class="drawer-head_text">
      <h3 class="drawer-title">Manage Credentials</h3>
      <p class="drawer-sub">{{ courierName }}</p>
    </div>
    <button type="button" class="close-btn" (click)="closeDialog()">
      <i class="ri-close-line"></i>
    </button>
  </div>

  <!-- Body -->
  <div class="drawer-body">
    <div class="field-grid">
      <div class="field">
        <label class="form-label"
          >Username <span class="req">*</span></label
        >
        <input
          type="text"
          name="username"
          class="form-control"
          [ngClass]="{ 'is-invalid': isInvalid.username }"
          [(ngModel)]="username"
          placeholder="Enter User Name"
          autocomplete="off"
          maxlength="15"
          (keypress)="allowOnlyAlphanumeric($event)"
          [disabled]="isDataPresent"
        />
      </div>

      <div class="field">
        <label class="form-label"
          >Password <span class="req">*</span></label
        >
        <input
          type="password"
          name="password"
          class="form-control"
          [ngClass]="{ 'is-invalid': isInvalid.password }"
          [(ngModel)]="password"
          placeholder="Enter Password"
          autocomplete="new-password"
          [disabled]="isDataPresent"
        />
      </div>

      <div class="field">
        <label class="form-label"
          >Customer ID <span class="req">*</span></label
        >
        <input
          type="text"
          name="customerId"
          class="form-control"
          [ngClass]="{ 'is-invalid': isInvalid.customerId }"
          [(ngModel)]="customerId"
          placeholder="Enter Customer Id"
          autocomplete="off"
          maxlength="15"
          (keypress)="allowOnlyAlphanumeric($event)"
          [disabled]="isDataPresent"
        />
      </div>

      <div class="field">
        <label class="form-label"
          >Contract ID <span class="req">*</span></label
        >
        <input
          type="text"
          name="contract-id"
          class="form-control"
          [ngClass]="{ 'is-invalid': isInvalid.contractId }"
          [(ngModel)]="contractId"
          placeholder="Enter Contract ID"
          autocomplete="off"
          maxlength="15"
          (keypress)="allowOnlyAlphanumeric($event)"
          [disabled]="isDataPresent"
        />
      </div>

      <div class="field">
        <label class="form-label"
          >Identifier <span class="req">*</span></label
        >
        <input
          type="text"
          name="identifier"
          class="form-control"
          [ngClass]="{ 'is-invalid': isInvalid.identifier }"
          [(ngModel)]="identifier"
          placeholder="Enter Identifier"
          autocomplete="off"
          maxlength="15"
          (keypress)="allowOnlyAlphanumeric($event)"
          [disabled]="isDataPresent"
        />
      </div>

      <div class="field">
        <label class="form-label"
          >Product Type <span class="req">*</span></label
        >
        <select
          class="form-select"
          [ngClass]="{ 'is-invalid': isInvalid.productype }"
          [(ngModel)]="productype"
          id="status"
          [disabled]="isDataPresent"
        >
          <option selected disabled>Select Product Type</option>
          <option value="SP">SP</option>
          <option value="BP">BP</option>
        </select>
      </div>
    </div>

    <!-- Validity -->
    <div class="section-title">
      <span>Validity</span>
      <span class="section-line"></span>
    </div>

    <div class="field-grid">
      <div class="field">
        <label class="form-label"
          >Expiry Date <span class="req">*</span></label
        >
        <input
          type="text"
          maxlength="10"
          placeholder="DD/MM/YYYY"
          (input)="onDateInput($event)"
          [(ngModel)]="formattedDate"
          [ngClass]="{ 'is-invalid': isInvalid.expireAt }"
          class="date-input form-control"
          (keypress)="allowOnlyNumeric($event)"
        />
      </div>
    </div>

    <!-- Barcode series -->
    <div class="section-title">
      <span>Barcode series</span>
      <i
        class="bi bi-info-circle info-icon"
        data-bs-toggle="tooltip"
        data-bs-placement="bottom"
        title="Numeric value without check digit."
      ></i>
      <span class="section-line"></span>
    </div>

    <div class="field-grid">
      <div class="field">
        <label class="form-label"
          >Start Series <span class="req">*</span></label
        >
        <input
          type="text"
          name="startSeries"
          class="form-control"
          [ngClass]="{ 'is-invalid': isInvalid.startSeries }"
          [(ngModel)]="startSeries"
          placeholder="Enter Start Series"
          autocomplete="off"
          maxlength="8"
          (keypress)="allowOnlyNumeric($event)"
        />
      </div>

      <div class="field">
        <label class="form-label"
          >End Series <span class="req">*</span></label
        >
        <input
          type="text"
          name="endSeries"
          class="form-control"
          [ngClass]="{ 'is-invalid': isInvalid.endSeries }"
          [(ngModel)]="endSeries"
          placeholder="Enter End Series"
          autocomplete="off"
          maxlength="8"
          (keypress)="allowOnlyNumeric($event)"
        />
      </div>
    </div>

    <!-- Stock -->
    <div class="section-title">
      <span>Stock</span>
      <span class="section-line"></span>
    </div>

    <ng-container *ngIf="stock?.length; else noData">
      <div class="stock-wrap">
        <table class="stock-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Start Series</th>
              <th>End Series</th>
              <th>Expiry Date</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let item of stock; let i = index">
              <td>{{ i + 1 }}</td>
              <td>{{ item.startSeries || "--" }}</td>
              <td>{{ item.endSeries || "--" }}</td>
              <td>{{ item.expireAt | date: "dd/MM/yyyy" }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </ng-container>

    <ng-template #noData>
      <div class="no-stock">No stock information available</div>
    </ng-template>
  </div>

  <!-- Footer -->
  <div class="drawer-foot">
    <button type="button" class="btn-cancel" (click)="closeDialog()">
      Cancel
    </button>
    <button type="button" class="btn-save" (click)="saveCredentials()">
      <i class="ri-check-line"></i> Save
    </button>
  </div>
</div>
