<div class="card orders-card">
  <div class="card-head">
    <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
      <div class="d-flex flex-column">
        <h5 class="mb-0">Shipments List</h5>
        <p>Personalised kits on their way to customers.</p>
      </div>

      <div class="ms-auto">
        <div class="d-flex justify-content-end align-items-center flex-wrap gap-2 link_items">

          @if (serviceType === 1) {
            <div class="task-tabs">
              <button
                class="tab-btn"
                [class.active]="activeTab === 'perso'"
                (click)="setTab('perso')"
              >
                <span>Perso</span>
              </button>

              <button
                class="tab-btn"
                [class.active]="activeTab === 'insta'"
                (click)="setTab('insta')"
              >
                <span>Insta</span>
              </button>
            </div>
          }

          @if (activeTab === "insta") {
            <button
              class="btn btn-outline-dark btn-sm"
              (click)="instaExportToCSV()"
              [disabled]="isExportingInsta"
            >
              <span *ngIf="!isExportingInsta">
                <i class="bi bi-download"></i> Export
              </span>
              <span *ngIf="isExportingInsta">
                <i class="ri-loader-4-line spin"></i> Exporting...
              </span>
            </button>
          }

          @if (activeTab === "perso") {
            <button
              class="btn btn-outline-dark btn-sm"
              (click)="persoExportToCSV()"
              [disabled]="isExportingPerso"
            >
              <span *ngIf="!isExportingPerso">
                <i class="bi bi-download"></i> Export
              </span>
              <span *ngIf="isExportingPerso">
                <i class="ri-loader-4-line spin"></i> Exporting...
              </span>
            </button>
          }
        </div>
      </div>
    </div>
  </div>

  @if (activeTab == "perso") {
    <app-shipment-list #persoShipments></app-shipment-list>
  }
  @if (activeTab == "insta") {
    <app-insta-shipment #instaShipments></app-insta-shipment>
  }
</div>
