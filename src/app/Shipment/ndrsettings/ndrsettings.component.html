<div class="card">
    <div class="card-head">
        <div class="row">
            <div class="col-md-6 col-sm-6">
                <h5><i class="ri-checkbox-blank-fill" style="border: 2px solid black;"></i> NDR Settings</h5>
            </div>
            <div class="col-md-6 col-sm-6 d-flex justify-content-end align-items-center">
                <button class=" btn btn-outline-dark btn-sm me-3" (click)="navigateToException()" onclick="makeActive(this)">
                    <i class="ri-arrow-left-circle-line"></i> Back
                </button>
                <button class=" btn btn-outline-dark btn-sm me-3" (click)="navigateToAddSettings()"  onclick="makeActive(this)">
                    <i class="bi-plus"></i> Add New
                </button>
            </div>
        </div>
    </div>
    <div class="card-body">
        <div class="row">
            <table class="table">
                <thead class="table-head-hover">
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">COURIER NAME</th>
                        <th scope="col">SEND TO EMAIL</th>
                        <th scope="col">CC EMAIL</th>
                        <th scope="col">EMAIL'S (PER DAY)</th>
                        <th scope="col">TIMING'S</th>
                        <th scope="col">STATUS</th>
                        <th scope="col">ACTION</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td scope="col"></td>
                        <td scope="col">1234</td>
                        <td scope="col">1234</td>
                        <td scope="col">96500</td>
                        <td scope="col">28-02-2024</td>
                        <td scope="col">colorplast</td>
                        <td scope="col">cards</td>
                        <td scope="col">COD</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
