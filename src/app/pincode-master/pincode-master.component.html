<div class="card">
  <div class="card-head">
    <!-- Card-header elements -->
    <div class="head-row">
      <div>
        <h5>Pincode Master</h5>
        <p class="page-sub">Destination master with courier coverage and volume.</p>
      </div>
      <button class="head-btn" (click)="openDialog()">
        <i class="ri-upload-2-line"></i> CSV Upload
      </button>
    </div>
  </div>

  <div class="card-body">
    <div class="filter-bar">
      <div class="field">
        <label for="pincode" class="form-label">Pincode</label>
        <input
          type="text"
          class="form-control form-control-sm"
          id="pincode"
          [(ngModel)]="pincode"
          placeholder="Enter Pincode Here"
        />
      </div>

      <div class="filter-actions">
        <button class="apply-btn" type="button" (click)="applyFilters()">
          Apply
        </button>
        <button class="clear-btn" type="button" (click)="clearFilters()">
          Clear
        </button>
      </div>
    </div>

    <div class="table-row">
      <table class="table">
        <thead class="table-head-hover">
          <tr>
            <th scope="col">Pincode</th>
            <th scope="col">Place</th>
            <th scope="col">Metro</th>
            <th scope="col">Couriers serving</th>
            <th scope="col">ODA</th>
            <th scope="col" class="num">Orders shipped</th>
            <th scope="col">Updated</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let data of pincodeData">
            <td>
              <span class="pin">{{ data.pincode }}</span>
              <i
                class="ri-file-copy-line copy-icon"
                (click)="copyPincode(data.pincode)"
              ></i>
            </td>
            <td><span class="place-name">{{ data.city }}</span></td>
            <td><span class="cell-muted">not yet</span></td>
            <td><span class="cell-muted">not yet</span></td>
            <td><span class="cell-muted">not yet</span></td>
            <td class="num"><span class="cell-muted">not yet</span></td>
            <td>{{ data.updatedAt | date: "dd MMM yyyy" }}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination  -->
    <div class="paginator-wrap">
      <app-paginator
        [length]="totalOrders"
        [pageSize]="pageSize"
        [pageSizeOptions]="[10, 20, 50, 100, 500, 1000]"
        [pageIndex]="pageIndex"
        (page)="handlePageEvent($event)"
      >
      </app-paginator>
    </div>
  </div>
</div>
