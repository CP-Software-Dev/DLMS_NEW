<div class="card" [@fadeSlideInOut]>
    <div class="card-head">
        <div class="row">
            <div class="col-8">
                <h3>Change Password</h3>
            </div>
            <div class="col close-form">
                <i class="close-icon ri-close-fill" (click)="closeDialog()"></i>
            </div>
        </div>

    </div>
    <div class="card-body">
        <div class="row">
            <div class="col">
                <label class="form-label">Old Password</label>
                <input type="password" [(ngModel)]="changepassmodal.oldPassword" name="oldPass" class="form-control "
                    placeholder="Enter Password" id="password">
            </div>
        </div>
        <div class="row">
            <div class="col">
                <label class="form-label">New Password</label>
                <input type="password" [(ngModel)]="changepassmodal.newPassword" name="newPass" class="form-control "
                    placeholder="Enter Password" id="password">
                <i class="bi bi-info-circle position-absolute"
                    style="top: 71%; right: 32px; transform: translateY(-50%); cursor: pointer;"
                    data-bs-toggle="tooltip" data-bs-placement="bottom"
                    title="Password must be at least 8 characters long, alphanumeric, with at least one uppercase letter, one lowercase letter, one special character, and no spaces."></i>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <label class="form-label">Confirm Password</label>
                <input type="password" [(ngModel)]="changepassmodal.confirmPassword" class="form-control "
                    placeholder="Enter Password" id="password" (input)="checkPasswords()"
                    [ngClass]="{'border-red': !passwordsMatch}">
                <div *ngIf="passwordErrorMessage" class="text-danger">{{ passwordErrorMessage }}</div>
            </div>
        </div>
        <div class="row">
            <div class="col-2" style="margin-right: 5px;">
                <button class="btn btn-outline-danger" (click)="closeDialog()">Close</button>
            </div>
            <div class="col-2">
                <button class="btn btn-primary" (click)="changePassword()">Save</button>
            </div>
        </div>
    </div>
</div>
