<div class="card">
  <div class="card-head">
    <div class="head-row">
      <div>
        <h5>Warehouse List</h5>
      </div>
      <div class="head-actions">
        <button
          class="head-btn"
          [class.active]="isActive === 'Export'"
          (click)="exportToCSV()"
        >
          <i class="ri-upload-2-line"></i> Export
        </button>
        <button
          class="head-btn head-btn--primary"
          (click)="navigateToAddWatehouse()"
        >
          <i class="bi-plus"></i> New Warehouse
        </button>
      </div>
    </div>
  </div>

  <div class="card-body">
    <div class="filter-bar">
      <!-- Bank Name -->
      <div class="field">
        <label for="sellerName" class="form-label">Bank Name</label>
        <select
          class="form-select form-select-sm"
          id="sellerName"
          [(ngModel)]="sellerId"
        >
          <option value="" selected disabled>Select Bank</option>
          <option *ngFor="let seller of sellerData" [value]="seller.id">
            {{ seller.name }}
          </option>
        </select>
      </div>

      <!-- type -->
      <div class="field">
        <label for="type" class="form-label">Warehouse Type</label>
        <select
          class="form-select form-select-sm"
          id="type"
          [(ngModel)]="type"
        >
          <option value="" selected disabled>Select Type</option>
          <option value="pick">Pickup</option>
          <option value="rto">RTO</option>
        </select>
      </div>

      <!-- Buttons -->
      <div class="filter-actions">
        <button class="apply-btn" type="button" (click)="applyFilters()">
          Apply
        </button>
        <button class="clear-btn" type="button" (click)="clearFilters()">
          Clear
        </button>
      </div>
    </div>

    <div class="table-row">
      <table class="table">
        <thead class="table-head-hover">
          <tr>
            <th scope="col">Warehouse </th>
            <th scope="col">Bank Name</th>
            <th scope="col">Contact Person</th>
            <th scope="col">Type</th>
            <th scope="col">Creation Date</th>
            <th scope="col">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let entry of warehouseEntries; let i = index">
            <td>
              <div class="cell-main">{{ entry.warehouseName }}</div>
              <span class="cell-sub">
                {{ getFullAddress(entry) }}
              </span>
            </td>
            <td><span class="pill pill-grey">{{ entry.institutionName }}</span></td>
            <td>
              <div class="cell-main">{{ entry.contactPerson }}</div>
              <span class="cell-sub"
                ><i class="bi bi-phone"></i>{{ entry.contactPersonNumber }}</span
              >
            </td>
            <td><span class="pill pill-blue">{{ entry.type }}</span></td>
            <td>{{ entry.date }}</td>
            <td>
              <button class="view-btn" (click)="editWarehouse(entry)">
                <i class="ri-pencil-fill"></i>{{ entry.action1 }}
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="paginator-wrap">
      <app-paginator
        [length]="totalCount"
        [pageSize]="pageSize"
        [pageSizeOptions]="[10, 20, 50, 100, 500, 1000]"
        [pageIndex]="pageIndex"
        (page)="handlePageEvent($event)"
      >
      </app-paginator>
    </div>
  </div>
</div>
