<div class="dlg">
  <div class="dlg-head">
    <div class="dlg-titles">
      <h5>Create Warehouse</h5>
      <p class="dlg-sub">{{ warehouseObj.warehouseName }}</p>
    </div>
    <button type="button" class="close-btn" (click)="close()" aria-label="Close">
      <i class="ri-close-line"></i>
    </button>
  </div>

  <div class="dlg-body">
    <div class="form-grid">
      <div class="field">
        <label for="courier-name" class="form-label"
          >Warehouse Name
          <span class="text-danger font-weight-bold">*</span>
        </label>
        <input
          type="text" style="cursor: not-allowed;"
          class="form-control form-control-sm"
          id="warehouse-name"
          readonly
          placeholder="Warehouse Name"
          [(ngModel)]="warehouseObj.warehouseName"
        />
      </div>

      <div class="field">
        <label for="api-key" class="form-label"
          >Unique Code
          <span class="text-danger font-weight-bold">*</span>
        </label>
        <input
          type="text"
          class="form-control form-control-sm"
          id="unique-code"
          placeholder="Enter Unique Code"
          [(ngModel)]="warehouseObj.uid"
        />
      </div>

      <div class="field">
        <label class="form-label">Bank Name <span class="text-danger">*</span></label>
        <select style="cursor: not-allowed;"
          class="form-select form-select-sm"
          [(ngModel)]="institutionId"
          disabled
          (ngModelChange)="onBankChange($event)"
        >
          <option value="" selected disabled>Select Bank</option>
          <option *ngFor="let bank of banks" id="company" [value]="bank.id">
            {{ bank.name }}
          </option>
        </select>
        <div *ngIf="invalidBankSelection" class="text-danger">Select Bank.</div>
      </div>

      <div class="field">
        <label class="form-label"
          >Warehouse Type <span class="text-danger">*</span></label
        >
        <select style="cursor: not-allowed;" disabled class="form-select form-select-sm" [(ngModel)]="warehouseType">
          <option value="" selected disabled>Select Warehouse Type</option>
          <option *ngFor="let role of userRole" id="company" [value]="role.id">
            {{ role.role }}
          </option>
        </select>
      </div>

      <div class="field">
        <label for="api-key" class="form-label"
          >Contact Name
          <span class="text-danger font-weight-bold">*</span>
        </label>
        <input
          type="text"
          class="form-control form-control-sm"
          id="contact-name"
          placeholder="Enter Contact Name"
          [(ngModel)]="warehouseObj.contactPerson"
        />
      </div>

      <div class="field">
        <label for="api-key" class="form-label"
          >Contact Number
          <span class="text-danger font-weight-bold">*</span>
        </label>
        <input
          type="text"
          class="form-control form-control-sm"
          id="contact-number"
          placeholder="Enter Contact Number"
          [(ngModel)]="warehouseObj.contactPersonNumber"
        />
      </div>

      <div class="field full">
        <label for="api-key" class="form-label"
          >Address Line 1
          <span class="text-danger font-weight-bold">*</span>
        </label>
        <input
          type="text"
          class="form-control form-control-sm"
          id="address-1"
          placeholder="Address Line 1 "
          [(ngModel)]="warehouseObj.address1"
        />
      </div>

      <div class="field full">
        <label for="api-key" class="form-label"
          >Address Line 2
        </label>
        <input
          type="text"
          class="form-control form-control-sm"
          id="address-2"
          placeholder="Address Line 2 "
          [(ngModel)]="warehouseObj.address2"
        />
      </div>

      <div class="field full">
        <label for="api-key" class="form-label"
          >Address Line 3
        </label>
        <input
          type="text"
          class="form-control form-control-sm"
          id="address-3"
          placeholder="Address Line 3 "
          [(ngModel)]="warehouseObj.address3"
        />
      </div>

      <div class="field">
        <label for="api-key" class="form-label"
          >City
          <span class="text-danger font-weight-bold">*</span>
        </label>
        <input
          type="text"
          class="form-control form-control-sm"
          id="city"
          placeholder="Enter City"
          [(ngModel)]="warehouseObj.city"
        />
      </div>

      <div class="field">
        <label for="api-key" class="form-label"
          >Pincode
          <span class="text-danger font-weight-bold">*</span>
        </label>
        <input
          type="text"
          class="form-control form-control-sm"
          id="pincode"
          placeholder="Enter Pincode"
          [(ngModel)]="warehouseObj.pincode"
        />
      </div>
    </div>
  </div>

  <div class="dlg-foot">
    <button type="button" class="cancel-btn" (click)="close()">Cancel</button>
    <button type="button" class="submit-btn" (click)="onSubmit()">
      <i class="ri-check-line"></i> Submit
    </button>
  </div>
</div>
