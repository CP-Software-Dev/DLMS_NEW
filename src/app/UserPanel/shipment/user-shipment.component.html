    <div class="card-head">

            <div class="col-md-6 col-sm-6">
                <h5><i class="ri-checkbox-blank-fill" style="border: 2px solid black;"> </i> Shipments</h5>

        <div class="form" style="margin-top: 30px;" *ngIf="showFiltersForm">
            <div class="row">
                <div class="col-md-3">
                    <div class="mb-2">
                        <label for="filterCriteria" class="form-label">From Date:</label>
                        <!-- <app-datepicker (dateRangeSelected)="onDateRangeSelected($event)"></app-datepicker> -->
                         <app-date-picker-invoice [selectedRange]="selectedDateRange" (dateRangeSelected)="onDateRangeSelected($event)"></app-date-picker-invoice>
                    </div>
                </div>
                
                <div class="col-md-3">
                    <div class="mb-2">
                        <label for="filterCriteria" class="form-label">Order ID(s):</label>
                        <input type="text" class="form-control form-control-sm" [(ngModel)]="orderIds"
                            placeholder="Enter Order Id separated by comma">
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="mb-2">
                        <label for="filterCriteria" class="form-label">AWB NO(s):</label>
                        <input type="text" class="form-control form-control-sm" [(ngModel)]="awbnumber"
                            placeholder="Enter AWB no(s) separated by comma">
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="mb-2">
                        <label for="filterCriteria" class="form-label">Kit Number:</label>
                        <input type="text" class="form-control form-control-sm" [(ngModel)]="kitnumber"
                            placeholder="Enter Kit Number">
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-3">
                    <div class="mb-2">
                        <label for="filterCriteria" class="form-label">Shipping Phone</label>
                        <input type="text" class="form-control form-control-sm" [(ngModel)]="phone"
                            placeholder="Shipping Phone here">
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="mb-2">
                        <label for="courier" class="form-label">Courier:</label>
                        <select class="form-select form-select-sm mb-2" id="sellerName" [(ngModel)]="courierId">
                            <option value="" selected>Select Courier</option>
                            <option *ngFor="let courier of courierData" [value]="courier.id">{{ courier.name }}</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <div class="button-grp mb-2 d-flex justify-content-start">
                        <button class="btn btn-outline-dark btn-sm me-3" type="button"
                            style="background-color: rgb(5, 114, 209); font-size: small; color: white;"
                            (click)="applyFilters()">Apply</button>
                        <button class="btn btn-danger btn-sm me-3" style="font-size: small; box-shadow: none;"
                            (click)="clearFilters()">Clear</button>
                    </div>
                </div>
            </div>
        </div>


    </div>
    <div class="card-body">


        <div class="row">

            <div class="col-sm-12 col-md-12">
                <button class="col-md-2 btn btn-sm mb-4 me-4" [class.active]="isActive === 'All'"
                    (click)="applyStatusFilter(null)">All</button>
                <button *ngFor="let button of statusData" class="col-md-2 btn btn-sm mb-4 me-4"
                    [class.active]="isActive === button.id.toString()" (click)="applyStatusFilter(button.id)">
                    {{ button.name }} ({{ getCountByStatusId(button.id) }})

                </button>

            </div>


            <app-loader [loading]="loading"></app-loader>

            <div class="table-con" *ngIf="!loading">
                <table class="table">
                    <thead class="table-head-hover">
                        <tr>

                            <th scope="col">Order</th>
                            <th scope="col">Kit Number</th>
                            <th scope="col">Date</th>
                            <th scope="col">Product</th>
                            <th scope="col">Customer</th>
                            <th scope="col">Weight</th>
                            <th scope="col">Carrier<br><span style="font-size: 12px; font-weight: 500;">
                                    <i class="ri-corner-down-right-line"></i>
                                    AWB
                                </span></th>
                            <th scope="col">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let order of paginatedOrders">

                            <td><span style="cursor: pointer; color:#0b72c7
                                ; font-weight: 700;" (click)="navigateToOrderDetail(order.orderID)">{{
                                    order.orderID }}</span> </td>
                            <td>{{ order.kitNumber}}</td>
                            <td>{{ order.date }}</td>
                            <td>{{ order.product }}</td>
                            <td>
                                <span [matTooltip]="getAddressTooltip(order)" matTooltipPosition="right"
                                    matTooltipClass="multiline-tooltip">
                                    {{ order.customer.length > 25 ? (order.customer | slice:0:19) + '...' :
                                    order.customer }}
                                </span>
                            </td>
                            <td>{{ order.weight }} <span>g</span></td>
                            <td><span style="font-weight: 600;">{{ order.courier }}</span><br><span
                                    (click)="navigateToAwbStatus(order.awb)" style="cursor: pointer; color:#0b72c7
                                ; font-weight: 700;" *ngIf="order.awb"><i class="ri-corner-down-right-line"></i>{{
                                    order.awb
                                    }}</span></td>
                            <!-- <td>{{ order.tags}}</td> -->
                            <td><button class="btn btn-sm statusbtn">{{
                                    order.shipmentStatus
                                    }}</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
        <app-paginator [length]="totalOrders" [pageSize]="pageSize" [pageSizeOptions]="[10, 20, 50, 100 , 500 , 1000]"
            [pageIndex]="pageIndex" (page)="handlePageEvent($event)">
        </app-paginator>
    </div>
</div>
