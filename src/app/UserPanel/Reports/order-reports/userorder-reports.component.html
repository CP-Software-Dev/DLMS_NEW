<div class="reports-container">
  <div class="create-report">
    <h4>Orders Report</h4>

    <div class="form-group row">
      <label class="col-sm-2 col-form-label report-label" for="reportName"
        >Report Name <font color="red">*</font>
      </label>
      <div class="col-sm-6">
        <input
          class="form-control"
          style="width: 100%"
          type="text"
          placeholder="Enter Report Name"
          id="reportName"
          name="reportName"
          [(ngModel)]="reportName"
          required
        />
      </div>
    </div>

    <div class="form-group row">
      <label for="dateRange" class="col-sm-2 col-form-label report-label"
        >Date range: <font color="red">*</font></label
      >
      <div class="col-sm-6">
        <app-datepicker
          (dateRangeSelected)="onDateRangeSelected($event)"
        ></app-datepicker>
      </div>
    </div>

    <!-- Insta / Perso Selection (Only for serviceType = 1) -->
    <div class="form-group row" *ngIf="serviceType === 1">
      <label class="col-sm-2 col-form-label report-label">
        Order Category <font color="red">*</font>
      </label>

      <div class="col-sm-6">
        <div class="form-check form-check-inline">
          <input
            class="form-check-input"
            type="radio"
            name="orderCategory"
            id="perso"
            [value]="2"
            [(ngModel)]="orderCategoryType"
          />
          <label class="form-check-label" for="perso">Perso</label>
        </div>

        <div class="form-check form-check-inline">
          <input
            class="form-check-input"
            type="radio"
            name="orderCategory"
            id="insta"
            [value]="3"
            [(ngModel)]="orderCategoryType"
          />
          <label class="form-check-label" for="insta">Insta</label>
        </div>
      </div>
    </div>

    <div class="form-group row">
      <label class="col-sm-2 col-form-label report-label"
        >Report Type <font color="red">*</font></label
      >
      <div class="col-sm-6">
        <div class="form-check form-check-inline">
          <input
            class="form-check-input"
            type="radio"
            id="barGraph"
            name="report-type"
            value="Bar"
            [(ngModel)]="selectedReportType"
            disabled
          />
          <label class="form-check-label type-label" for="barGraph"
            >Bar Graph</label
          >
        </div>
        <div class="form-check form-check-inline">
          <input
            class="form-check-input"
            type="radio"
            id="pieChart"
            name="report-type"
            value="Pie"
            [(ngModel)]="selectedReportType"
            disabled
          />
          <label class="form-check-label type-label" for="pieChart"
            >Pie Chart</label
          >
        </div>
        <div class="form-check form-check-inline">
          <input
            class="form-check-input"
            type="radio"
            id="tableView"
            name="report-type"
            value="Table"
            [(ngModel)]="selectedReportType"
            required
          />
          <label class="form-check-label type-label" for="tableView"
            >Table View</label
          >
        </div>
      </div>
    </div>

    <div *ngIf="selectedReportType === 'Table'" class="row">
      <div class="col-sm-2 col-form-label report-label">
        <label for="table-columns"
          >Order Columns<font color="red">*</font>
        </label>
      </div>
      <div class="col-sm-9">
        <div class="row">
          <div class="col">
            <input
              type="checkbox"
              id="selectAllOrder"
              [(ngModel)]="selectAllOrderChecked"
              (change)="selectAllOrderCheckboxChanged()"
              class="mx-3"
              name="SelectAllOrder"
            />
            <label for="selectAllOrder">Select All</label>
          </div>
        </div>
        <div class="row">
          <div class="col">
            <ng-container
              *ngFor="let checkbox of orderCheckboxes; let i = index"
            >
              <div class="col-4 mb-1" style="display: inline-block">
                <input
                  type="checkbox"
                  [id]="checkbox.id"
                  [(ngModel)]="checkbox.checked"
                  (change)="checkboxChanged()"
                  class="mx-1"
                  [name]="checkbox.id"
                />
                <label [for]="checkbox.id" class="mx-1 checkbox-label-small">{{
                  checkbox.label
                }}</label>
              </div>
              <div *ngIf="(i + 1) % 6 === 0" class="w-100"></div>
            </ng-container>
          </div>
        </div>
      </div>
    </div>

    <div class="form-group row">
      <label class="col-sm-2 col-form-label report-label" for="status"
        >Order Status <font color="red">*</font></label
      >
      <div
        class="dropdown col-sm-6"
        id="statusFilterDropdown"
        style="margin-right: 10px"
      >
        <button
          class="dropbtn"
          type="button"
          (click)="toggleDropdown()"
          [title]="
            selectedStatusNames.length > 0
              ? selectedStatusNames.join(', ')
              : 'Order Status'
          "
        >
          <span class="selected-statuses">
            {{
              selectedStatusNames.length > 0
                ? selectedStatusNames.join(", ")
                : "Order Status"
            }}
          </span>
          <i class="bi bi-chevron-down" style="margin-left: 5px"></i>
        </button>
        <div class="dropdown-content" [ngClass]="{ show: dropdownOpen }">
          <label>
            <input
              type="checkbox"
              [checked]="allSelected"
              (change)="toggleSelectAll($event)"
            />
            Select All
          </label>
          <label *ngFor="let status of filteredStatuses">
            <input
              type="checkbox"
              [value]="status.id"
              [checked]="selectedStatusIds.includes(status.id)"
              (change)="toggleSelection(status)"
            />
            {{ status.name }}
          </label>
        </div>
      </div>
    </div>

    <div class="form-actions" style="margin-top: 50px">
      <button
        type="button"
        class="btn btn-primary"
        style="margin-right: 10px"
        (click)="createReport()"
        [disabled]="isCreating"
      >
        <span *ngIf="!isCreating"> Create </span>

        <span *ngIf="isCreating"> Creating... </span>
      </button>
      <button
        type="button"
        class="btn btn-secondary"
        (click)="navigatetoReports()"
      >
        Cancel
      </button>
    </div>
  </div>
</div>
