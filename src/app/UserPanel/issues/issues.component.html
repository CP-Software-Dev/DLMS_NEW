      </div>
    </div>
  </div>
  <div class="card-body">
    <div class="table-row">
      <table class="table">
        <thead class="table-head-hover">

           <tr>
            <th scope="col-2">Ticket</th>
            <th scope="col-2">Subject</th>
            <th scope="col">Bank</th>
            <th scope="col">Priority</th>
            <th scope="col">Owner</th>
            <th scope="col">comment</th>
            <th scope="col">DUE</th>
            <th scope="col">Status</th>
            <th scope="col">View</th>
          </tr>
        </thead>
        <tbody>
          <!-- <tr *ngFor="let issue of issuesList">
                        <td scope="col-2">{{issue.subject}}</td>
                        <td scope="col">{{issue.institution}}</td>
                        <td scope="col">{{issue.priority}}</td>

          <tr *ngFor="let issue of issuesList">
            <td scope="col-2">{{ issue.ticketId }} <span>{{issue.issueDescription}}</span></td>
            <td scope="col">{{ issue.subject }}</td>
            <td scope="col">{{ issue.institution }}</td>
            <td scope="col">{{ issue.priority || "null" }}</td>
            <td scope="col">{{ issue.username }}</td>
            <td scope="col">{{ issue.comment || "Not Yet" }}</td>
            <td scope="col">{{ issue.due || "Not Yet" }}</td>
            <td scope="col">
              <span [ngClass]="'badge ' + getStatusClass(issue.status)">
                {{ issue.status }}
              </span>
            </td>
            <td scope="col">
              <button
                class="btn btn-sm btn-primary"
                (click)="viewDetails(issue)"
              >
                <i class="ri-eye-line"></i> View
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <app-paginator
      [length]="totalCount"
      [pageSize]="10"
      [pageSizeOptions]="[10, 20, 50]"
      (page)="handlePageEvent($event)"
    ></app-paginator>
  </div>
</div>
