<div class="card">
    <div class="card-head">
        <div class="row">
            <div class="col-md-7 col-sm-7 d-flex align-items-center">
                <h5 class="mb-0 me-4">
                    <i class="ri-checkbox-blank-fill" style="border: 2px solid black;"></i>
                    Orders
                </h5>

                @if(serviceType === 1){<div class="task-tabs">

                    <button class="tab-btn" [class.active]="activeTab === 'perso'" (click)="setTab('perso')">
                        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        <span>Perso</span>
                    </button>

                    <button class="tab-btn" [class.active]="activeTab === 'insta'" (click)="setTab('insta')">
                        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <line x1="8" y1="6" x2="21" y2="6"></line>
                            <line x1="8" y1="12" x2="21" y2="12"></line>
                            <line x1="8" y1="18" x2="21" y2="18"></line>
                            <circle cx="3" cy="6" r="1"></circle>
                            <circle cx="3" cy="12" r="1"></circle>
                            <circle cx="3" cy="18" r="1"></circle>
                        </svg>
                        <span>Insta</span>
                    </button>

                </div>}
            </div>
            <div class="col-md-5 col-sm-5 d-flex justify-content-end align-items-center">
                @if(activeTab=== 'insta'){<button class="btn btn-outline-dark btn-sm me-3" (click)="instaExportToCSV()">
                    <i class="ri-export-fill"></i> Export
                </button>}
                @if(activeTab=== 'perso'){<button class="btn btn-outline-dark btn-sm me-3" (click)="persoExportToCSV()">
                    <i class="ri-export-fill"></i> Export
                </button>}
                @if(activeTab=== 'insta'){<button class="btn btn-outline-dark btn-sm me-3"
                    (click)=" onInstaFilters()">
                    <i [class]="buttonIcon"></i> Filter
                </button>
                }
                @if(activeTab=== 'perso'){<button class="btn btn-outline-dark btn-sm me-3" (click)="onPersoFilters()">
                    <i [class]="buttonIcon"></i>  Filter
                </button>}
            </div>
        </div>
    </div>

    @if(activeTab == 'perso'){
    <app-user-orders #persoOrders></app-user-orders>
    }
    @if(activeTab == 'insta'){
    <app-user-insta-orders #instaOrders></app-user-insta-orders>
    }
</div>
