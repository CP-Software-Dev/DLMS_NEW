<div class="main-container">
  <div class="card">
    <div class="card-head">
      <div class="head-row">
        <div>
          <h5>Employees</h5>
          <p class="page-sub">Users of your institution and their access.</p>
        </div>
        <button class="btn btn-sm new-user-btn" (click)="openDialog()">
          <span class="plus">+</span> New User
        </button>
      </div>
    </div>

    <div class="card-body">
      <div class="table-row table-responsive-wrap">
        <table class="table">
          <thead class="table-head-hover">
            <tr>
              <th scope="col">Name</th>
              <th scope="col">Role</th>
              <th scope="col">Permissions</th>
              <th scope="col">Last Seen</th>
              <th scope="col">Status</th>
              <th scope="col">Action</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let user of EmployeeData">
              <td class="col-name">
                <span class="user-name">{{ user.firstName }} {{ user.lastName }}</span>
                <span class="user-email">{{ user.emailAddress }}</span>
              </td>

              <td>
                <span class="role-pill">{{ roleNames[user.roleId] || "-" }}</span>
              </td>

              <td>
                <span class="cell-muted">Null</span>
              </td>

              <td>
                <span class="cell-text">{{
                  user.lastLogin ? getDaysSince(user.lastLogin) + " days" : "Never"
                }}</span>
              </td>

              <td class="nowrap">
                <span class="pill" [ngClass]="getStatusClass(user.status)">
                  <span class="pill-dot"></span>{{ user.status }}
                </span>
              </td>

              <td class="nowrap">
                <button class="btn btn-sm primary" (click)="editDetails(user)">
                  <i class="ri-edit-line"></i> Edit
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="paginator-wrap">
        <app-paginator
          [length]="totalOrders"
          [pageSize]="pageSize"
          [pageSizeOptions]="[10, 20, 50, 100, 200]"
          [pageIndex]="pageIndex"
          (page)="handlePageEvent($event)"
        ></app-paginator>
      </div>
    </div>
  </div>
</div>
