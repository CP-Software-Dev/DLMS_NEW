<div class="sidenav" (mouseenter)="onMouseEnter()" (mouseleave)="onMouseLeave()"
    [ngClass]="collapsed ? 'sidenav-collapsed' : ''">
    <div class="logo-container">
        <i class="logo ri-menu-line" (click)="toggleCollapse()"></i>
        <img src="assets\Images\CP1.png" class="company-logo" alt="Dashboard Image"
            style="height: 35px; width: 100%; margin-right: 10px" />
    </div>
    <ul class="sidenav-nav">
        <li class="sidenav-nav-item" [ngClass]="isLinkActive('user/dashboard') ? 'active' : ''">
            <a class="sidenav-nav-link" (click)="toUserDashboard()">
                <i class="sidenav-link-icon ri-dashboard-line"></i>
                <span class="sidenav-link-text" *ngIf="collapsed"> Dashboard </span>
            </a>
        </li>
        <li *ngIf="hasOrder" class="sidenav-nav-item" [ngClass]="isLinkActive('user/orders') ? 'active' : ''">
            <a class="sidenav-nav-link" (click)="toUserOrders()">
                <i class="sidenav-link-icon ri-pages-line"></i>
                <span class="sidenav-link-text" *ngIf="collapsed"> Orders </span>
            </a>
        </li>
        <li *ngIf="hasShipments || hasNdr || hasRto" class="sidenav-dropdown" [ngClass]="{ active: isShipmentDropdownActive() }">
            <a class="dropdown-nav-link" (click)="toggleShipmentClicked()">
                <i class="dropdown-link-icon bi-truck"></i>
                <span class="dropdown-link-text" *ngIf="collapsed">Shipments <i [class]="buttonIcon"></i></span>
            </a>

            <div class="submenu" *ngIf="shipmentClicked">
        <li *ngIf="hasShipments" class="submenu-nav-item mt-2"
            [ngClass]="isLinkActive('user/shipment') ? 'active' : ''">
            <a class="submenu-nav-link" (click)="toUserShipments()">
                <i class="submenu-link-icon ri-list-check-3"></i>
                <span class="submenu-link-text" *ngIf="collapsed">
                    Shipment List
                </span>
            </a>
        </li>

        <li *ngIf="hasNdr" class="submenu-nav-item" [ngClass]="isLinkActive('user/ndr') ? 'active' : ''">
            <a class="submenu-nav-link" (click)="toUserNDR()">
                <i class="submenu-link-icon ri-list-check-2"></i>
                <span class="submenu-link-text" *ngIf="collapsed"> NDR List </span>
            </a>
        </li>

        <li *ngIf="hasRto" class="submenu-nav-item" [ngClass]="isLinkActive('user/rto') ? 'active' : ''">
            <a class="submenu-nav-link" (click)="toUserRTO()">
                <i class="submenu-link-icon bi bi-bootstrap-reboot"></i>
                <span class="submenu-link-text" *ngIf="collapsed">
                    RTO Process
                </span>
            </a>
        </li>
</div>
</li>

<li *ngIf="rolenum === 3" class="sidenav-nav-item" [ngClass]="isLinkActive('user/couriers') ? 'active' : ''">
    <a class="sidenav-nav-link" (click)="toCouriers()">
        <i class="sidenav-link-icon bi-box-seam"></i>
        <span class="sidenav-link-text" *ngIf="collapsed"> Couriers </span>
    </a>
</li>
<li *ngIf="rolenum === 3" class="sidenav-nav-item" [ngClass]="isLinkActive('user/employees') ? 'active' : ''">
    <a class="sidenav-nav-link" (click)="toEmployee()">
        <i class="sidenav-link-icon ri-user-3-line"></i>
        <span class="sidenav-link-text" *ngIf="collapsed"> User Access </span>
    </a>
</li>
<li *ngIf="hasReports" class="sidenav-nav-item" [ngClass]="isLinkActive('user/reports') ? 'active' : ''">
    <a class="sidenav-nav-link" (click)="toUserReports()">
        <i class="sidenav-link-icon ri-file-chart-line"></i>
        <span class="sidenav-link-text" *ngIf="collapsed"> Reports </span>
    </a>
</li>
<li class="sidenav-nav-item" [ngClass]="isLinkActive('user/issues') ? 'active' : ''">
    <a class="sidenav-nav-link" (click)="toIssues()">
        <i class="sidenav-link-icon ri-question-answer-line"></i>
        <span class="sidenav-link-text" *ngIf="collapsed"> Issues </span>
    </a>
</li>
</ul>
</div>
