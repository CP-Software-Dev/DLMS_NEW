<div class="parent">

    <div class="container d-flex justify-content-center align-items-center">

        <div class="row min-vh-100 min-vw-100">

            <div class="col-md-6 left-box">

                <img src="assets\Images\CP2.png" alt="" class="left-box-img right-rounded">
            </div>

            <div class="col-sm-12 col-md-6 d-flex justify-content-center align-items-center">

                <div class="container-fluid right-box">
                   
                        <div class="col-sm-12 col-md-12">

                            <h3 class="mb-4">OTP Verification</h3>
                            <hr class="my-1" style="width: 100%;">
                            

                                <div class="input-group mb-3 mt-4">
                                    <input type="text"  [(ngModel)]="otp" class="form-control form-control-lg bg-light fs-6"  placeholder="Enter OTP" id="otp">
                                </div>
                                
                                <div class="input-group mb-4">
                                    <a class="btn btn-submit w-100 fs-6" (click)="login()"  >Verify</a>
                                </div>
                        </div>
                </div>

            </div>

        </div>

    </div>
    
</div>
